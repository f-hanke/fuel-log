<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1613">
<title>Fuel Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg: #0F1613;
    --bg-panel: #161F1B;
    --bg-panel-2: #1C2722;
    --line: #2A3833;
    --ink: #E9F0EC;
    --ink-dim: #8FA39A;
    --lime: #C6F135;
    --lime-dim: #7C9A2C;
    --amber: #F2A93B;
    --red: #E8654F;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --font-body: 'Inter', -apple-system, sans-serif;
  }
  @font-face{
    font-family:'Bebas Neue';
    src: local('Arial Narrow Bold');
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body);
    padding:0 0 60px 0;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px;}

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:var(--font-display); font-size:34px; letter-spacing:1px;
    text-transform:uppercase; color:var(--lime); line-height:1;
  }
  .brand small{
    display:block; font-family:var(--font-mono); font-size:10px;
    letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; margin-top:4px;
  }

  .datebar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:16px;
  }
  .datebar button{
    background:none; border:none; color:var(--ink-dim); font-size:20px; cursor:pointer;
    padding:4px 10px; border-radius:6px;
  }
  .datebar button:hover{ color:var(--lime); background:var(--bg-panel-2); }
  .datebar .datelabel{
    font-family:var(--font-mono); font-size:13px; letter-spacing:0.5px; text-align:center;
  }
  .datebar .datelabel .today-tag{
    color:var(--lime); font-size:10px; letter-spacing:1.5px; display:block; margin-top:2px;
  }

  .ring-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;
  }
  .stat{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 8px; text-align:center;
  }
  .stat .num{
    font-family:var(--font-display); font-size:26px; letter-spacing:0.5px; line-height:1;
  }
  .stat .label{
    font-family:var(--font-mono); font-size:9px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:1.5px; margin-top:4px;
  }
  .stat .sub{
    font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-top:2px;
  }
  .stat.kcal .num{color:var(--lime);}
  .stat.protein .num{color:var(--amber);}
  .stat.carbs .num{color:#5FB7E8;}
  .stat.fat .num{color:var(--red);}

  .bar-track{
    height:5px; background:var(--bg-panel-2); border-radius:3px; margin-top:8px; overflow:hidden;
  }
  .bar-fill{height:100%; border-radius:3px;}
  .kcal .bar-fill{background:var(--lime);}
  .protein .bar-fill{background:var(--amber);}
  .carbs .bar-fill{background:#5FB7E8;}
  .fat .bar-fill{background:var(--red);}

  .section-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-dim); margin:22px 0 10px 2px;
  }

  .meal{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .meal .name{font-size:14px; font-weight:600;}
  .meal .macros{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); margin-top:3px;
  }
  .meal .kcalval{font-family:var(--font-mono); font-size:16px; color:var(--lime); margin-right:10px;}
  .meal-right{display:flex; align-items:center;}
  .del-btn{
    background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px;
    padding:2px 6px; border-radius:6px;
  }
  .del-btn:hover{color:var(--red); background:var(--bg-panel-2);}

  .empty{
    color:var(--ink-dim); font-size:13px; text-align:center; padding:24px 10px;
    border:1px dashed var(--line); border-radius:10px;
  }

  .addform{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-top:10px;
  }
  .addform .row{display:flex; gap:8px; margin-bottom:8px;}
  .addform input{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--ink); padding:9px 10px; font-family:var(--font-body); font-size:13px;
    width:100%; outline:none;
  }
  .addform input:focus{border-color:var(--lime);}
  .addform input.name-input{flex:2;}
  .addform .macrow input{flex:1; min-width:0;}
  .addform .macrow{margin-bottom:10px;}
  .addform label.mini{
    font-family:var(--font-mono); font-size:9px; color:var(--ink-dim);
    text-transform:uppercase; display:block; margin-bottom:3px; letter-spacing:1px;
  }
  .macrocell{flex:1;}
  .add-submit{
    width:100%; background:var(--lime); color:#0F1613; border:none; border-radius:8px;
    padding:11px; font-family:var(--font-mono); font-weight:700; font-size:12px;
    letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; margin-top:2px;
  }
  .add-submit:hover{background:#D9FF55;}
  .add-submit:disabled{opacity:0.4; cursor:default;}

  .week-toggle{
    text-align:center; margin-top:26px;
  }
  .week-toggle button{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    padding:9px 18px; border-radius:20px; cursor:pointer;
  }
  .week-toggle button:hover{border-color:var(--lime); color:var(--lime);}

  .week-panel{margin-top:16px;}
  .week-day{
    display:grid; grid-template-columns:64px 1fr 50px; align-items:center; gap:10px;
    padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .week-day .wd-label{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);}
  .week-day .wd-label .wd-date{display:block; font-size:9px; opacity:0.7;}
  .week-day .wd-bar-track{height:6px; background:var(--bg-panel-2); border-radius:3px; overflow:hidden;}
  .week-day .wd-bar-fill{height:100%; background:var(--lime); border-radius:3px;}
  .week-day .wd-kcal{font-family:var(--font-mono); font-size:12px; text-align:right;}
  .week-day.is-today .wd-label{color:var(--lime);}

  .week-summary{
    display:flex; justify-content:space-between; background:var(--bg-panel);
    border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;
  }
  .week-summary div{text-align:center; flex:1;}
  .week-summary .wsnum{font-family:var(--font-display); font-size:22px; color:var(--lime);}
  .week-summary .wslabel{font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; margin-top:2px;}

  .loading{text-align:center; color:var(--ink-dim); padding:30px; font-family:var(--font-mono); font-size:12px;}
  .hidden{display:none !important;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-box{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
    padding:20px; max-width:340px; width:100%;
  }
  .modal-box .modal-title{font-size:15px; font-weight:600; margin-bottom:4px;}
  .modal-box .modal-text{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-bottom:18px;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; border-radius:8px; padding:11px; font-family:var(--font-mono);
    font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; border:1px solid var(--line);
  }
  .modal-btn-cancel{background:var(--bg-panel-2); color:var(--ink);}
  .modal-btn-cancel:hover{border-color:var(--ink-dim);}
  .modal-btn-confirm{background:var(--red); color:#0F1613; border-color:var(--red);}
  .modal-btn-confirm:hover{background:#F2846F;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Fuel Log<small>Ernährungstracker</small></div>
  </div>

  <div class="datebar">
    <button id="prevDay">‹</button>
    <div class="datelabel">
      <span id="dateText">–</span>
      <span class="today-tag hidden" id="todayTag">HEUTE</span>
    </div>
    <button id="nextDay">›</button>
  </div>

  <div id="dayView">
    <div class="ring-row">
      <div class="stat kcal">
        <div class="num" id="statKcal">0</div>
        <div class="label">kcal</div>
        <div class="sub" id="statKcalSub">von 3200</div>
        <div class="bar-track"><div class="bar-fill" id="barKcal" style="width:0%"></div></div>
      </div>
      <div class="stat protein">
        <div class="num" id="statProtein">0</div>
        <div class="label">Protein g</div>
        <div class="sub" id="statProteinSub">von 130</div>
        <div class="bar-track protein"><div class="bar-fill" id="barProtein" style="width:0%"></div></div>
      </div>
      <div class="stat carbs">
        <div class="num" id="statCarbs">0</div>
        <div class="label">Carbs g</div>
        <div class="sub" id="statCarbsSub">von 460</div>
        <div class="bar-track carbs"><div class="bar-fill" id="barCarbs" style="width:0%"></div></div>
      </div>
      <div class="stat fat">
        <div class="num" id="statFat">0</div>
        <div class="label">Fett g</div>
        <div class="sub" id="statFatSub">von 90</div>
        <div class="bar-track fat"><div class="bar-fill" id="barFat" style="width:0%"></div></div>
      </div>
    </div>

    <div class="section-title">Mahlzeiten</div>
    <div id="mealList"></div>

    <div class="section-title">Eintrag hinzufügen</div>
    <div class="addform">
      <div class="row">
        <input type="text" class="name-input" id="mName" placeholder="z.B. Abendbrot Nudeln + Tofu">
      </div>
      <div class="row macrow">
        <div class="macrocell">
          <label class="mini">Kcal</label>
          <input type="number" id="mKcal" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Protein g</label>
          <input type="number" id="mProtein" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Carbs g</label>
          <input type="number" id="mCarbs" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Fett g</label>
          <input type="number" id="mFat" placeholder="0" min="0">
        </div>
      </div>
      <button class="add-submit" id="addBtn">Hinzufügen</button>
    </div>

    <div class="week-toggle">
      <button id="toggleWeek">Wochenübersicht anzeigen</button>
    </div>
  </div>

  <div id="weekView" class="week-panel hidden">
    <div class="week-summary">
      <div><div class="wsnum" id="wsKcalAvg">0</div><div class="wslabel">Ø kcal/Tag</div></div>
      <div><div class="wsnum" id="wsProteinAvg">0</div><div class="wslabel">Ø Protein/Tag</div></div>
      <div><div class="wsnum" id="wsDaysLogged">0</div><div class="wslabel">Tage geloggt</div></div>
    </div>
    <div id="weekList"></div>
    <div class="week-toggle">
      <button id="toggleWeekBack">Zurück zum Tag</button>
    </div>
  </div>

</div>

<div class="modal-overlay hidden" id="deleteModal">
  <div class="modal-box">
    <div class="modal-title">Eintrag löschen?</div>
    <div class="modal-text" id="deleteModalText"></div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="deleteCancelBtn">Nein</button>
      <button class="modal-btn-confirm" id="deleteConfirmBtn">Ja, löschen</button>
    </div>
  </div>
</div>

<script>
const TARGETS = { kcal: 3200, protein: 130, carbs: 460, fat: 90 };
const DOW = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function fmtKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtLabel(d){
  return `${DOW[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`;
}
function isSameDay(a,b){ return fmtKey(a)===fmtKey(b); }

let currentDate = new Date();
let currentEntries = [];

async function loadEntries(dateObj){
  const key = 'fuellog:entries:' + fmtKey(dateObj);
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
async function saveEntries(dateObj, entries){
  const key = 'fuellog:entries:' + fmtKey(dateObj);
  try{
    localStorage.setItem(key, JSON.stringify(entries));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
  }
}

function sumEntries(entries){
  return entries.reduce((acc,e)=>{
    acc.kcal += Number(e.kcal)||0;
    acc.protein += Number(e.protein)||0;
    acc.carbs += Number(e.carbs)||0;
    acc.fat += Number(e.fat)||0;
    return acc;
  }, {kcal:0,protein:0,carbs:0,fat:0});
}

function pct(val, target){ return Math.max(0, Math.min(100, Math.round((val/target)*100))); }

async function renderDay(){
  document.getElementById('dateText').textContent = fmtLabel(currentDate);
  document.getElementById('todayTag').classList.toggle('hidden', !isSameDay(currentDate, new Date()));

  currentEntries = await loadEntries(currentDate);
  const totals = sumEntries(currentEntries);

  document.getElementById('statKcal').textContent = Math.round(totals.kcal);
  document.getElementById('statKcalSub').textContent = `von ${TARGETS.kcal}`;
  document.getElementById('barKcal').style.width = pct(totals.kcal, TARGETS.kcal) + '%';

  document.getElementById('statProtein').textContent = Math.round(totals.protein);
  document.getElementById('statProteinSub').textContent = `von ${TARGETS.protein}`;
  document.getElementById('barProtein').style.width = pct(totals.protein, TARGETS.protein) + '%';

  document.getElementById('statCarbs').textContent = Math.round(totals.carbs);
  document.getElementById('statCarbsSub').textContent = `von ${TARGETS.carbs}`;
  document.getElementById('barCarbs').style.width = pct(totals.carbs, TARGETS.carbs) + '%';

  document.getElementById('statFat').textContent = Math.round(totals.fat);
  document.getElementById('statFatSub').textContent = `von ${TARGETS.fat}`;
  document.getElementById('barFat').style.width = pct(totals.fat, TARGETS.fat) + '%';

  const listEl = document.getElementById('mealList');
  listEl.innerHTML = '';
  if(currentEntries.length === 0){
    listEl.innerHTML = '<div class="empty">Noch keine Mahlzeiten für diesen Tag erfasst.</div>';
  } else {
    currentEntries.forEach((e, idx)=>{
      const row = document.createElement('div');
      row.className = 'meal';
      row.innerHTML = `
        <div>
          <div class="name">${escapeHtml(e.name || 'Mahlzeit')}</div>
          <div class="macros">P ${Math.round(e.protein)||0}g · C ${Math.round(e.carbs)||0}g · F ${Math.round(e.fat)||0}g</div>
        </div>
        <div class="meal-right">
          <span class="kcalval">${Math.round(e.kcal)||0}</span>
          <button class="del-btn" data-idx="${idx}" title="Löschen">✕</button>
        </div>
      `;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.getAttribute('data-idx'));
        openDeleteModal(idx);
      });
    });
  }
}

let pendingDeleteIdx = null;

function openDeleteModal(idx){
  pendingDeleteIdx = idx;
  const entry = currentEntries[idx];
  document.getElementById('deleteModalText').textContent = entry ? (entry.name || 'Mahlzeit') : '';
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal(){
  pendingDeleteIdx = null;
  document.getElementById('deleteModal').classList.add('hidden');
}

document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);
document.getElementById('deleteModal').addEventListener('click', (e)=>{
  if(e.target.id === 'deleteModal') closeDeleteModal();
});
document.getElementById('deleteConfirmBtn').addEventListener('click', async ()=>{
  if(pendingDeleteIdx === null) return;
  currentEntries.splice(pendingDeleteIdx, 1);
  await saveEntries(currentDate, currentEntries);
  closeDeleteModal();
  renderDay();
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('prevDay').addEventListener('click', ()=>{
  currentDate = new Date(currentDate.getTime() - 86400000);
  renderDay();
});
document.getElementById('nextDay').addEventListener('click', ()=>{
  currentDate = new Date(currentDate.getTime() + 86400000);
  renderDay();
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('mName').value.trim();
  const kcal = document.getElementById('mKcal').value;
  const protein = document.getElementById('mProtein').value;
  const carbs = document.getElementById('mCarbs').value;
  const fat = document.getElementById('mFat').value;
  if(!name || !kcal){ return; }
  currentEntries.push({
    name, kcal: Number(kcal)||0, protein: Number(protein)||0,
    carbs: Number(carbs)||0, fat: Number(fat)||0
  });
  await saveEntries(currentDate, currentEntries);
  document.getElementById('mName').value='';
  document.getElementById('mKcal').value='';
  document.getElementById('mProtein').value='';
  document.getElementById('mCarbs').value='';
  document.getElementById('mFat').value='';
  renderDay();
});

document.getElementById('toggleWeek').addEventListener('click', async ()=>{
  document.getElementById('dayView').classList.add('hidden');
  document.getElementById('weekView').classList.remove('hidden');
  await renderWeek();
});
document.getElementById('toggleWeekBack').addEventListener('click', ()=>{
  document.getElementById('weekView').classList.add('hidden');
  document.getElementById('dayView').classList.remove('hidden');
});

async function renderWeek(){
  const listEl = document.getElementById('weekList');
  listEl.innerHTML = '<div class="loading">Lade Woche…</div>';

  const days = [];
  const base = new Date();
  for(let i=6; i>=0; i--){
    days.push(new Date(base.getTime() - i*86400000));
  }

  const results = [];
  for(const d of days){
    const entries = await loadEntries(d);
    results.push({ date: d, totals: sumEntries(entries), logged: entries.length>0 });
  }

  const loggedDays = results.filter(r=>r.logged);
  const avgKcal = loggedDays.length ? Math.round(loggedDays.reduce((s,r)=>s+r.totals.kcal,0)/loggedDays.length) : 0;
  const avgProtein = loggedDays.length ? Math.round(loggedDays.reduce((s,r)=>s+r.totals.protein,0)/loggedDays.length) : 0;

  document.getElementById('wsKcalAvg').textContent = avgKcal;
  document.getElementById('wsProteinAvg').textContent = avgProtein + 'g';
  document.getElementById('wsDaysLogged').textContent = loggedDays.length + '/7';

  listEl.innerHTML = '';
  results.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'week-day' + (isSameDay(r.date, new Date()) ? ' is-today' : '');
    row.innerHTML = `
      <div class="wd-label">${DOW[r.date.getDay()]}<span class="wd-date">${r.date.getDate()}.${r.date.getMonth()+1}.</span></div>
      <div class="wd-bar-track"><div class="wd-bar-fill" style="width:${pct(r.totals.kcal, TARGETS.kcal)}%"></div></div>
      <div class="wd-kcal">${r.logged ? Math.round(r.totals.kcal) : '–'}</div>
    `;
    listEl.appendChild(row);
  });
}

renderDay();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
