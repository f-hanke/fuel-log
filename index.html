<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1613">
<title>Fuel Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">Fuel Log<small>Ernährungstracker</small></div>
  </div>

  <div class="datebar" id="datebar">
    <button id="prevDay">‹</button>
    <div class="datelabel">
      <span id="dateText">–</span>
      <span class="today-tag hidden" id="todayTag">HEUTE</span>
    </div>
    <button id="nextDay">›</button>
  </div>

  <div id="dayView">
    <div class="ring-row">
      <div class="stat kcal">
        <div class="num" id="statKcal">0</div>
        <div class="label">kcal</div>
        <div class="sub" id="statKcalSub">von 3200</div>
        <div class="bar-track"><div class="bar-fill" id="barKcal" style="width:0%"></div></div>
      </div>
      <div class="stat protein">
        <div class="num" id="statProtein">0</div>
        <div class="label">Protein g</div>
        <div class="sub" id="statProteinSub">von 130</div>
        <div class="bar-track protein"><div class="bar-fill" id="barProtein" style="width:0%"></div></div>
      </div>
      <div class="stat carbs">
        <div class="num" id="statCarbs">0</div>
        <div class="label">Carbs g</div>
        <div class="sub" id="statCarbsSub">von 460</div>
        <div class="bar-track carbs"><div class="bar-fill" id="barCarbs" style="width:0%"></div></div>
      </div>
      <div class="stat fat">
        <div class="num" id="statFat">0</div>
        <div class="label">Fett g</div>
        <div class="sub" id="statFatSub">von 90</div>
        <div class="bar-track fat"><div class="bar-fill" id="barFat" style="width:0%"></div></div>
      </div>
    </div>

    <div class="section-title">Mahlzeiten</div>
    <div id="mealList"></div>

    <div class="section-title">Eintrag hinzufügen</div>
    <div class="addform">
      <div class="row">
        <input type="text" class="name-input" id="mName" placeholder="z.B. Abendbrot Nudeln + Tofu">
      </div>
      <div class="row macrow">
        <div class="macrocell">
          <label class="mini">Kcal</label>
          <input type="number" id="mKcal" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Protein g</label>
          <input type="number" id="mProtein" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Carbs g</label>
          <input type="number" id="mCarbs" placeholder="0" min="0">
        </div>
        <div class="macrocell">
          <label class="mini">Fett g</label>
          <input type="number" id="mFat" placeholder="0" min="0">
        </div>
      </div>
      <button class="add-submit" id="addBtn">Hinzufügen</button>
    </div>

    <div class="week-toggle">
      <button id="toggleWeek">Wochenübersicht anzeigen</button>
    </div>
  </div>

  <div id="weekView" class="week-panel hidden">
    <div class="week-summary">
      <div><div class="wsnum" id="wsKcalAvg">0</div><div class="wslabel">Ø kcal/Tag</div></div>
      <div><div class="wsnum" id="wsProteinAvg">0</div><div class="wslabel">Ø Protein/Tag</div></div>
      <div><div class="wsnum" id="wsDaysLogged">0</div><div class="wslabel">Tage geloggt</div></div>
    </div>
    <div id="weekList"></div>
    <div class="week-toggle">
      <button id="toggleWeekBack">Zurück zum Tag</button>
    </div>
  </div>

</div>

<div class="modal-overlay hidden" id="deleteModal">
  <div class="modal-box">
    <div class="modal-title">Eintrag löschen?</div>
    <div class="modal-text" id="deleteModalText"></div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="deleteCancelBtn">Nein</button>
      <button class="modal-btn-confirm" id="deleteConfirmBtn">Ja, löschen</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
